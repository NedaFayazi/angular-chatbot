<div class="auth-layout">
  <section class="auth-brand">
    <img
      ngSrc="/images/angular-ai-course-logo.png"
      width="448"
      height="181"
      priority
      alt=""
      class="auth-brand__logo"
    />
    <p class="auth-brand__title">Angular AI In Depth</p>
  </section>

  <main class="auth-card">
    <div class="auth-card__body">
      <header class="auth-card__header">
    <!--    <img
          src="/images/angular-university-logo.svg"
          width="136"
          height="135"
          alt="Angular University"
          class="auth-card__logo"
        />-->
        <h1 class="auth-card__title">Sign Up</h1>
      </header>

      <form class="auth-form" [formRoot]="signUpForm">
        <div class="auth-field">
          <label class="auth-sr-only" for="sign-up-email">Email</label>
          <div class="auth-input-wrap">
            <input
              id="sign-up-email"
              class="auth-input"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Email"
              [formField]="signUpForm.email"
              [attr.aria-invalid]="emailError() ? 'true' : null"
              [attr.aria-describedby]="emailError() ? 'sign-up-email-error' : null"
            />
          </div>
          @if (emailError(); as message) {
            <p class="auth-error" id="sign-up-email-error">{{ message }}</p>
          }
        </div>

        <div class="auth-field">
          <label class="auth-sr-only" for="sign-up-password">Password</label>
          <div class="auth-input-wrap">
            <input
              id="sign-up-password"
              class="auth-input auth-input--with-toggle"
              [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Password"
              [formField]="signUpForm.password"
              [attr.aria-invalid]="passwordError() ? 'true' : null"
              [attr.aria-describedby]="passwordError() ? 'sign-up-password-error' : null"
            />
            <button
              type="button"
              class="auth-password-toggle"
              [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="passwordVisible()"
              (click)="togglePasswordVisibility()"
            >
              @if (passwordVisible()) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <path d="M1 1l22 22" />
                  <path d="M4.9 4.9C2.6 6.6 1 9 1 9s3 8 11 8a9.7 9.7 0 0 0 5.4-1.6" />
                </svg>
              } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
          @if (passwordError(); as message) {
            <p class="auth-error" id="sign-up-password-error">{{ message }}</p>
          }
        </div>

        <div class="auth-field">
          <label class="auth-sr-only" for="sign-up-confirm-password">Confirm Password</label>
          <div class="auth-input-wrap">
            <input
              id="sign-up-confirm-password"
              class="auth-input auth-input--with-toggle"
              [type]="confirmPasswordVisible() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Confirm Password"
              [formField]="signUpForm.confirmPassword"
              [attr.aria-invalid]="confirmPasswordError() ? 'true' : null"
              [attr.aria-describedby]="confirmPasswordError() ? 'sign-up-confirm-password-error' : null"
            />
            <button
              type="button"
              class="auth-password-toggle"
              [attr.aria-label]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="confirmPasswordVisible()"
              (click)="toggleConfirmPasswordVisibility()"
            >
              @if (confirmPasswordVisible()) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <path d="M1 1l22 22" />
                  <path d="M4.9 4.9C2.6 6.6 1 9 1 9s3 8 11 8a9.7 9.7 0 0 0 5.4-1.6" />
                </svg>
              } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
          @if (confirmPasswordError(); as message) {
            <p class="auth-error" id="sign-up-confirm-password-error">{{ message }}</p>
          }
        </div>

        <button type="submit" class="auth-submit" [disabled]="signUpForm().invalid()">
          Create Account
        </button>
      </form>

      <p class="auth-divider">or</p>

      <div class="auth-google-wrapper">
        <div class="auth-google-gis" #googleButton ></div>
        <a
          class="auth-google"
          tabindex="-1"
          aria-hidden="true"
        >
          <svg class="auth-google__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.06 12.25c0-.85-.08-1.67-.22-2.45H12v4.64h6.2a5.3 5.3 0 0 1-2.3 3.48v2.89h3.72c2.18-2 3.44-4.96 3.44-8.46z" />
            <path fill="#34A853" d="M12 24c3.1 0 5.7-1.03 7.62-2.79l-3.72-2.89c-1.03.69-2.35 1.1-3.9 1.1-3 0-5.55-2.03-6.46-4.76H1.7v2.98A11.5 11.5 0 0 0 12 24z" />
            <path fill="#FBBC05" d="M5.54 14.27a6.9 6.9 0 0 1 0-4.53V6.76H1.7a11.5 11.5 0 0 0 0 10.49l3.84-2.98z" />
            <path fill="#EA4335" d="M12 4.75c1.69 0 3.2.58 4.4 1.72l3.3-3.3A11.5 11.5 0 0 0 12 0 11.5 11.5 0 0 0 1.7 6.76l3.84 2.98C6.45 6.78 9 4.75 12 4.75z" />
          </svg>
          <span>Sign up with Google</span>
        </a>
      </div>
    </div>

    <footer class="auth-card__footer">
      Already have an account?
      <a class="auth-link" routerLink="/sign-in">Sign in</a> here
    </footer>
  </main>
</div>
