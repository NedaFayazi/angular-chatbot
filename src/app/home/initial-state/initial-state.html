<section
  class="flex w-full max-w-[var(--content-max-width)] flex-col items-center text-center"
  aria-label="Start a new conversation"
>
  <img
    ngSrc="/images/angular-ai-course-logo.png"
    width="448"
    height="181"
    priority
    alt="Angular AI In Depth"
    class="h-auto w-[clamp(11rem,38vw,20rem)]"
  />

  <h1
    class="mt-4 mb-8 bg-[image:var(--gradient-title)] bg-clip-text text-[clamp(1.5rem,4vw,2.25rem)] font-semibold text-transparent"
  >
    Angular AI In Depth
  </h1>

  <form
    (submit)="onSubmit($event)"
    class="flex w-full items-end gap-2 rounded-2xl border border-[var(--color-border)] bg-[var(--color-bg-elevated)] py-2.5 pr-2.5 pl-4 shadow-[var(--shadow-panel)] transition-colors hover:border-[var(--color-border-strong)] focus-within:border-[var(--color-border-strong)]"
  >
    <span class="flex shrink-0 pb-1.5 text-[var(--color-text-muted)]" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </span>

    <input
      type="text"
      [formField]="messageForm.text"
      placeholder="Ask anything…"
      aria-label="Ask anything…"
      autocomplete="off"
      class="message-input min-w-0 flex-1 border-0 bg-transparent py-1 leading-6 text-left text-[var(--color-text-primary)] outline-none placeholder:text-[var(--color-text-muted)]"
    />

    <button
      type="submit"
      [disabled]="messageForm().invalid()"
      aria-label="Send message"
      class="flex size-9 shrink-0 items-center justify-center rounded-full bg-[var(--color-accent)] text-[var(--color-text-on-accent)] transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="19" x2="12" y2="5" />
        <polyline points="6 11 12 5 18 11" />
      </svg>
    </button>
  </form>
</section>
