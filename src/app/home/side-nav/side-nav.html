<div class="flex h-full flex-col gap-1 p-3">
  <header
    class="mb-2 flex min-h-10 items-center gap-2"
    [class.justify-between]="!collapsed()"
    [class.justify-center]="collapsed()"
  >
    @if (!collapsed()) {
      <angular-logo class="size-8 shrink-0" />
    }
    <button
      type="button"
      (click)="toggleCollapsed.emit()"
      [attr.aria-label]="collapsed() ? 'Expand navigation panel' : 'Collapse navigation panel'"
      [attr.aria-expanded]="!collapsed()"
      class="flex shrink-0 rounded-lg p-1.5 w-12 h-12 focus-visible:bg-white/5 focus-visible:text-[var(--color-text-primary)] active:bg-white/5 active:text-[var(--color-text-primary)]  text-[var(--color-text-secondary)] transition-colors hover:bg-white/5 hover:text-[var(--color-text-primary)]"
    >
      <svg class="m-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <line x1="9" y1="4" x2="9" y2="20" />
      </svg>
    </button>
  </header>

  @if (collapsed()) {
    <angular-logo class="mx-auto mb-2 size-8" />
  }

  <div class="flex min-w-0 flex-col gap-0.5">
    <button
      type="button"
      (click)="newChat.emit()"
      [attr.aria-label]="collapsed() ? 'New chat' : null"
      class="flex  w-full min-w-0 h-12 focus-visible:bg-white/5 focus-visible:text-[var(--color-text-primary)] active:bg-white/5 active:text-[var(--color-text-primary)] items-center gap-3 rounded-lg px-2.5 py-2 text-[0.9375rem] text-[var(--color-text-secondary)] transition-colors hover:bg-white/5 hover:text-[var(--color-text-primary)]"
      [class.justify-center]="collapsed()"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
      </svg>
      @if (!collapsed()) {
        <span class="truncate" animate.enter="nav-label-enter" animate.leave="nav-label-leave">New Chat</span>
      }
    </button>

    <button
      type="button"
      (click)="toggleSearch()"
      [attr.aria-label]="collapsed() ? 'Search in chat' : null"
      [attr.aria-expanded]="collapsed() ? null : searchOpen()"
      class="flex focus-visible:bg-white/5 focus-visible:text-[var(--color-text-primary)] active:bg-white/5 active:text-[var(--color-text-primary)]  w-full min-w-0 h-12 items-center gap-3 rounded-lg px-2.5 py-2 text-[0.9375rem] text-[var(--color-text-secondary)] transition-colors hover:bg-white/5 hover:text-[var(--color-text-primary)]"
      [class.justify-center]="collapsed()"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      @if (!collapsed()) {
        <span class="truncate" animate.enter="nav-label-enter" animate.leave="nav-label-leave">Search in Chat</span>
      }
    </button>

    @if (!collapsed() && searchOpen()) {
      <input
        type="text"
        [formField]="searchForm.query"
        placeholder="Search chats…"
        aria-label="Search chats"
        class="search-input mt-1 w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-1.5 text-sm text-[var(--color-text-primary)] outline-none transition-colors placeholder:text-[var(--color-text-muted)] focus-visible:border-[var(--color-border-strong)]"
      />
    }
  </div>

  @if (!collapsed()) {
    <div class="mt-3 min-h-0 flex-1 overflow-y-auto overflow-x-hidden">
      <chat-history
        [conversations]="visibleConversations()"
        [activeConversationId]="activeConversationId()"
        (selectConversation)="selectConversation.emit($event)"
      />
    </div>
  } @else {
    <div class="flex-1"></div>
  }

  <button
    type="button"
    (click)="logout.emit()"
    [attr.aria-label]="collapsed() ? 'Log out' : null"
    class="flex mt-auto h-12
      w-full min-w-0 items-center gap-3 rounded-lg px-2.5 py-2 text-[0.9375rem] text-[var(--color-danger)] transition-colors hover:bg-white/5 hover:text-[var(--color-danger)] focus-visible:bg-white/5 focus-visible:text-[var(--color-danger)] active:bg-white/5 active:text-[var(--color-danger)] aria-[current]:bg-[color-mix(in_srgb,var(--color-accent)_16%,transparent)] aria-[current]:text-[var(--color-text-primary)]"
    [class.justify-center]="collapsed()"
  >
    <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
    @if (!collapsed()) {
      <span class="truncate" animate.enter="nav-label-enter" animate.leave="nav-label-leave">Log out</span>
    }
  </button>
  @if (profile(); as user) {
    <button type="button" class="user-chip">
      <span class="user-chip__avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="user-chip__name" [title]="user.email">{{ displayName() }}</span>
    </button>
  }
</div>
