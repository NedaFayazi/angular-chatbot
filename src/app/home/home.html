<div class="flex h-screen w-full overflow-hidden bg-[var(--color-bg)]">
  <side-nav
    [collapsed]="sidebarCollapsed()"
    [conversations]="conversations()"
    [activeConversationId]="activeConversationId()"
    (toggleCollapsed)="toggleSidebar()"
    (newChat)="startNewChat()"
    (selectConversation)="selectConversation($event)"
    (logout)="logout()"
  />

  @if (!sidebarCollapsed()) {
    <button
      type="button"
      (click)="toggleSidebar()"
      aria-label="Close navigation panel"
      class="fixed inset-0 z-40 hidden border-0 bg-black/50 max-md:block"
    ></button>
  }
  <main class="flex min-w-0 flex-1 flex-col overflow-hidden max-md:pl-16">
    @if (activeConversation(); as conversation) {
      <conversation-thread
        [conversation]="conversation"
        [isLoading]="isLoading()"
        (sendMessage)="sendMessage($event)"
      />
    } @else {
      <initial-state
        [resetToken]="newChatToken()"
        (sendMessage)="sendMessage($event)"
      />
    }
  </main>
</div>
