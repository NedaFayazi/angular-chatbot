<div
  class="pointer-events-none fixed inset-x-0 top-0 z-[100] flex flex-col items-center gap-2.5 p-3 sm:p-4"
  role="region"
  aria-label="Notifications"
>
  @for (message of messages(); track message.id) {
    <div
      class="user-message pointer-events-auto relative flex w-full max-w-[24rem] items-start gap-3 overflow-hidden rounded-xl border p-4 pr-3.5 text-left"
      [class.user-message--error]="message.kind === 'error'"
      [class.user-message--warning]="message.kind === 'warning'"
      [class.user-message--info]="message.kind === 'info'"
      [class.user-message--success]="message.kind === 'success'"
      [attr.role]="message.kind === 'error' ? 'alert' : 'status'"
      aria-atomic="true"
      animate.enter="user-message--entering"
      animate.leave="user-message--leaving"
    >
      <span
        class="user-message__icon mt-0.5 flex size-9 shrink-0 items-center justify-center rounded-full"
        aria-hidden="true"
      >
        @switch (message.kind) {
          @case ('error') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          }
          @case ('warning') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          }
          @case ('success') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          }
          @default {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
          }
        }
      </span>

      <div class="flex min-w-0 flex-1 flex-col gap-0.5 py-0.5">
        <p class="text-[0.9375rem] font-semibold tracking-tight text-[var(--color-text-primary)]">
          {{ kindHeadings[message.kind] }}
        </p>
        <p class="text-sm leading-relaxed break-words text-[var(--color-text-secondary)]">
          {{ message.text }}
        </p>
      </div>

      <button
        type="button"
        class="user-message__close -m-1 flex size-7 shrink-0 items-center justify-center rounded-lg text-[var(--color-text-muted)] transition-colors hover:bg-white/5 hover:text-[var(--color-text-primary)] focus-visible:bg-white/5 focus-visible:text-[var(--color-text-primary)]"
        (click)="dismiss(message.id)"
        aria-label="Dismiss notification"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <span
        class="user-message__timer absolute inset-x-0 bottom-0 h-0.5 origin-left"
        aria-hidden="true"
        (animationend)="dismiss(message.id)"
      ></span>
    </div>
  }
</div>
