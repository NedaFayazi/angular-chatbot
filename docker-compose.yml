services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    restart: "no"

  backend:
    image: nedafayazi/chatbot-backend:1.0
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - AI_API_URL=http://ollama:11434/v1/chat/completions
    depends_on:
      - ollama

  frontend:
    image: nedafayazi/chatbot-frontend:1.0
    ports:
      - "4200:80"
    depends_on:
      - backend
    profiles: [ "full" ]

volumes:
  ollama_data:
