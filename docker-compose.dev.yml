services:
  backend:
    image: nedafayazi/chatbot-backend:1.0
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  node_modules:
